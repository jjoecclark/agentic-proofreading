# All settings for the outer harness (PLAN.md Section 10). Paths are relative to this file
# unless they start with "/" or "~".
config_version: "2"   # 2: proofread-neuron negatives, per-kind score, test every round

data:
  # operations_v3.csv = the source's operations.csv (kept as data/operations.csv, sha256 00a51c046bee2682)
  # with (v2) the 17 splits that did not survive to materialization 783 replaced by the next surviving
  # splits of the source sampler's own draw (build/replace_splits.py), then (v3) the 16 edits on a root
  # tagged glia / not a neuron / trachea replaced by the next clean ones (build/replace_edits.py);
  # data/splits.json version 3
  operations_csv: data/operations_v3.csv
  source_repo: https://github.com/brychang/flywire-edit-sampling
  source_commit: 05f9f38535748517937f630c4ccbc281cb7fc8eb
  source_path: outputs/operations.csv
  sha256_prefix: cc5a2dad5e6802f6            # of operations_csv; checked at startup (outer/config.py)

flywire:
  datastack: flywire_fafb_public              # CAVE token: caveclient's default secret file
  em_source: precomputed://https://bossdb-open-data.s3.amazonaws.com/flywire/fafbv14

splits: {train: 100, val: 50, test: 50, seed: 0}
scoring: {hit_radius_um: 2.0}

# Negative tasks (right answer: none), built from proofread neurons by build/build_negatives.py
# (negative_version 2). no_merge: two proofread neurons that share >= min_synapses synapses (A->B plus
# B->A, cleft_score > min_cleft_score); no_split: one proofread neuron. Pool: proofread_neurons at
# check_materialization, minus roots tagged by exclude_tag_regex in neuron_information_v2 (glia, not a
# neuron, trachea) or without a neuron super_class. Dated at a random edit time of the matching edit type
# (+- time_jitter_days), using only neurons whose root already existed then. Each neuron is used once.
negatives:
  check_materialization: 783
  n_no_merge: 400
  n_no_split: 400
  split_counts: {train: 200, val: 100, test: 100}   # per kind (user, 2026-11-20)
  min_synapses: 5
  min_cleft_score: 50
  time_jitter_days: 14
  exclude_tag_regex: "glia|astrocyte|not a neuron|not_a_neuron|trachea"
  seed: 0

models:
  meta_agent: claude-opus-5-5
  inner_allowed: [claude-opus-5-5]           # the proxy rejects other models

# USD per million tokens. Cache prices are explicit because they are not a fixed multiple of the
# input price on every model (Opus 5.5: cache read $0.20 = 0.05 x input; 5-minute cache write
# 1.25 x input; 1-hour cache write 2 x input).
prices_usd_per_mtok:
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_write_5m: 5.00, cache_write_1h: 8.00, cache_read: 0.20}

limits:
  task_wall_s: 1800
  parallel_tasks: 8                          # tasks evaluated at once (evaluate.py)
  meta_wall_s: 14400                         # wall-time limit for one meta-agent session

budget_usd:                                  # placeholders until Phase 5 measures real costs
  per_task: 2.00
  meta_session: 30.00
  meta_probe: 20.00
  total: 500                                # set by the user before Phase 6
  ask_above: 20.00                           # ask the user before any step expected to cost more

# Keep a revision if its val score (mean of the per-kind hit rates: merge, split, no_merge, no_split)
# beats the best's by at least accept_min_gain_pp percentage points on the same tasks. Every evaluated
# harness is also run on test (recorded only; never used to decide, never shown to the meta-agent).
loop: {max_rounds: 101, accept_min_gain_pp: 2.0, plateau_rounds: 101, evaluate_test_every_round: true}

# Services run on the vis node. Sandboxed code reaches them only through these Unix sockets,
# which are bound into containers that have no network (PLAN.md Section 7, vis-node variant).
world:
  host: della-vis1
  port: null
  socket: services/world/world.sock
  cache_dir: services/world/cache
  max_cutout_voxels: 67108864                # 64 Mi voxels per EM/supervoxel/segmentation cutout
  max_roots_per_call: 100000

proxy:
  host: della-vis1
  port: null
  socket: services/llm/llm.sock
  upstream: https://api.anthropic.com
  api_key_file: ~/.config/flywire_harness/anthropic_api_key   # only the proxy reads this

secrets:
  token_secret_file: ~/.config/flywire_harness/token_secret   # signs world and run tokens; auto-created

sandbox:
  image: outer/sandbox.sif
  definition: outer/sandbox.def
  meta_tools: [Read, Write, Edit, Bash, Glob, Grep, TodoWrite]  # no web tools
